<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Sản Phẩm | ShopAdmin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <h2>ShopAdmin</h2>
      <ul>
        <li class="active">
          <a href="../index.html"><i class="fas fa-home"></i> Tổng quan</a>
        </li>
        <li>
          <a href="./index.html"><i class="fas fa-box"></i> Sản phẩm</a>
        </li>
        <li>
          <a href="../orders/index.html"><i class="fas fa-shopping-bag"></i> Đơn hàng</a>
        </li>
        <li>
          <a href="../customers/index.html"><i class="fas fa-users"></i> Khách hàng</a>
        </li>
        <li>
          <a href="../reports/index.html"><i class="fas fa-chart-line"></i> Báo cáo</a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <header>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Tìm tên sản phẩm, mã SKU...">
        </div>
        <div class="user-actions">
          <button id="btnAddProduct" class="btn-add">

            <i class="fas fa-plus"></i>

            Thêm sản phẩm

          </button>
        </div>
      </header>

      <section class="stats">
        <div class="card">
          <h3>Tổng sản phẩm</h3>
          <p>1,240</p>
        </div>
        <div class="card">
          <h3>Sắp hết hàng</h3>
          <p style="color: #e74c3c;">12</p>
        </div>
        <div class="card">
          <h3>Danh mục</h3>
          <p>15</p>
        </div>
      </section>

      <section class="table-container">
        <div class="table-header">
          <h3>Danh mục sản phẩm</h3>
          <div class="filters">
            <select>
              <option>Tất cả danh mục</option>
              <option>Điện thoại</option>
              <option>Phụ kiện</option>
            </select>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Hình</th>
              <th>Thông tin sản phẩm</th>
              <th>Danh mục</th>
              <th>Giá bán</th>
              <th>Tồn kho</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="productModal" class="modal">
    <div class="modal-content">
      <h3>Thêm sản phẩm mới</h3>
      <form id="productForm">
        <input id="name" type="text" placeholder="Tên sản phẩm">
        <input id="price" type="text" placeholder="Giá bán">
        <input id="stock" type="number" placeholder="Số lượng tồn kho">
        <select id="category">

          <option value="11">
            Điện Thoại
          </option>

          <option value="12">
            Quần Áo
          </option>

          <option value="13">
            Giày Dép
          </option>

        </select>
        <input id="image" type="text" placeholder="Link ảnh">
        <div class="modal-buttons">
          <button
                  type="button"
                  class="btn-cancel"
                  onclick="closeModal()">

            Hủy

          </button>
          <button id="btnSave" type="button" class="btn-add">
            Lưu sản phẩm
          </button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>

</html>
