        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--dark-color);
            color: white;
            padding: 25px;
            position: fixed;
            height: 100vh;
            left: 0;
            z-index: 1000;
            transition: 0.3s;
        }

        .sidebar h2 {
            margin-bottom: 30px;
            text-align: center;
            color: var(--primary-color);
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }

        .sidebar ul li i {
            margin-right: 15px;
        }

        .sidebar ul li.active {
            background: #34495e;
            color: var(--primary-color);
        }


        /* Loại bỏ định dạng mặc định của thẻ a trong sidebar */
        .sidebar ul li a {
            text-decoration: none;
            /* Bỏ gạch chân */
            color: inherit;
            /* Ăn theo màu chữ của thẻ li cha */
            display: block;
            /* Giúp người dùng bấm vào toàn bộ vùng của li chứ không chỉ mỗi chữ */
            width: 100%;
        }
    </style>
